stages:
  data_ingestion:
    cmd: uv run --no-sync python dvc_pipeline.py data_ingestion
    deps:
      - dvc_pipeline.py
      - notebooks/sales_timeseries_2025.csv
      - src/mlops_end_2_end/data/data_ingestion/data_ingestion.py
      - src/mlops_end_2_end/utils.py
    outs:
      - data/raw/sales_timeseries_2025.csv

  data_cleaning:
    cmd: uv run --no-sync python dvc_pipeline.py data_cleaning
    deps:
      - dvc_pipeline.py
      - src/mlops_end_2_end/data/data_cleaning/data_cleaning_timeseries.py
      - src/mlops_end_2_end/utils.py
      - data/raw/sales_timeseries_2025.csv
    outs:
      - data/processed/cleaned_data.csv

  data_preprocessing:
    cmd: uv run --no-sync python dvc_pipeline.py data_preprocessing
    deps:
      - dvc_pipeline.py
      - src/mlops_end_2_end/data/data_preprocessing/data_preprocessing.py
      - src/mlops_end_2_end/utils.py
      - data/processed/cleaned_data.csv
    outs:
      - data/processed/preprocessed_data.csv

  feature_engineering:
    cmd: uv run --no-sync python dvc_pipeline.py feature_engineering
    deps:
      - dvc_pipeline.py
      - src/mlops_end_2_end/model/feature_engineering.py
      - src/mlops_end_2_end/utils.py
      - data/processed/cleaned_data.csv
    outs:
      - data/engineered_features/engineered_features.csv

  model_training:
    cmd: uv run --no-sync python dvc_pipeline.py model_training
    deps:
      - dvc_pipeline.py
      - src/mlops_end_2_end/model/model_training.py
      - src/mlops_end_2_end/utils.py
      - data/engineered_features/engineered_features.csv
    params:
      - params.yaml:
          - hyperparameter.train_fraction
          - hyperparameter.random_seed
          - hyperparameter.learning_rate
          - hyperparameter.n_estimators
          - hyperparameter.num_leaves
          - hyperparameter.max_depth
          - hyperparameter.subsample
          - hyperparameter.colsample_bytree
          - hyperparameter.reg_alpha
          - hyperparameter.reg_lambda
    outs:
      - models/trained/lightgbm_model.pkl
    metrics:
      - reports/training_metrics.json

  model_explainer:
    cmd: uv run --no-sync python dvc_pipeline.py model_explainer
    deps:
      - dvc_pipeline.py
      - src/mlops_end_2_end/model/model_explainer.py
      - src/mlops_end_2_end/model/model_training.py
      - data/engineered_features/engineered_features.csv
      - models/trained/lightgbm_model.pkl
    outs:
      - reports/explanations/

  model_inference:
    cmd: uv run --no-sync python dvc_pipeline.py model_inference
    deps:
      - dvc_pipeline.py
      - src/mlops_end_2_end/model/model_inference.py
      - data/engineered_features/engineered_features.csv
      - models/trained/lightgbm_model.pkl
    outs:
      - data/predictions/predictions.csv

  model_monitoring:
    cmd: uv run --no-sync python dvc_pipeline.py model_monitoring
    deps:
      - dvc_pipeline.py
      - src/mlops_end_2_end/model/model_monitoring.py
      - src/mlops_end_2_end/utils.py
      - data/engineered_features/engineered_features.csv
      - models/trained/lightgbm_model.pkl
    outs:
      - reports/monitoring/