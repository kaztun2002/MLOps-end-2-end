hyperparameter:
  random_seed: 42
  forecast_horizon: 1
  train_fraction: 0.8
  learning_rate: 0.05
  n_estimators: 300
  num_leaves: 31
  max_depth: -1
  subsample: 0.9
  colsample_bytree: 0.9
  reg_alpha: 0.1
  reg_lambda: 0.1

split:
  train_file: train.csv
  test_file: test.csv
  split_ratio: 0.20

dir:
  raw: data/raw
  cleaned: data/clean
  processed: data/processed
  train: data/train
  test: data/test

mode_dir: model